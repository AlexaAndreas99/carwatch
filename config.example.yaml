# CarWatch configuration — example
# --------------------------------
#
# setup.ps1 / setup.sh copy this file to `config.yaml`. You do not need to edit
# it: open CarWatch and add your searches from the dashboard (the + next to
# "Configurations"), by pasting the search links from each site. The dashboard
# writes them into the `searches:` list at the bottom of this file.
#
# Nothing about any make or model is baked into the code: CarWatch tracks
# whatever searches you give it, across any subset of the three sites.

settings:
  db_path: "./carwatch.db"
  request_delay_seconds: [1.5, 4.0]   # random pause between page requests (politeness)
  delist_after_missed_runs: 1         # bump to 2 if you see listings flicker in/out
  user_agent: "CarWatch/1.0 (personal use)"

  # If a site blocks us, leave it alone for this many hours instead of asking
  # again on the next run. Backing off is politer, and avoids turning a
  # temporary block into a hardened one. 0 disables it.
  blocked_cooldown_hours: 12

  # Per-site pacing. mobile.de is by far the heaviest source — nine pages where
  # the others take one or two — and is the one site collected against
  # robots.txt, so it gets a noticeably gentler cadence.
  per_site:
    mobilede:
      request_delay_seconds: [5.0, 12.0]

searches: []

# Prefer editing by hand? Entries in the `searches:` list above look like the
# one below (with nothing added yet, replace `[]` with the list). For each site: open it in your browser, set your filters, run the
# search, then COPY THE URL FROM THE ADDRESS BAR. That URL already encodes your
# filters — CarWatch just paginates it. The name is the configuration's
# identity: renaming it starts a new price history.
#
# searches:
#   - name: "My first search"
#     # display/grouping only - the real filtering lives in the URLs
#     make: "Nissan"
#     model: "Qashqai"
#     year_min: 2024
#     price_max: 30000
#     currency: "EUR"
#     enabled: true
#     sources:
#       - site: "autovit"          # the best-structured of the three
#         url: "https://www.autovit.ro/autoturisme/..."
#       - site: "olx"              # needs the Chromium that setup installs
#         url: "https://www.olx.ro/autoturisme/..."
#       # mobile.de: German market, best-effort. The URL must be a
#       # /ro/vehicule/cautare.html one - the /ro/automobil/... pages carry no
#       # ad ids, and the German suchen.mobile.de host returns 403. Its
#       # robots.txt disallows this path; collecting it is your call for
#       # personal, low-volume use. Works fine with this source left out.
#       - site: "mobilede"
#         url: "https://www.mobile.de/ro/vehicule/cautare.html?..."
