# CarWatch configuration
# ----------------------
#
# The searches below are the ones actually being tracked. The database they
# feed is the only copy of their price history, and it is worth something only
# because it has been collected into repeatedly - so edit these when your
# requirements change, not to make a test convenient.
#
# Nothing about this make and model, these year ranges, or these particular filters
# is baked into the code. The tool tracks any make/model/year/price across any
# subset of the three sites, purely from the search URLs pasted here - so adding
# or replacing a search is a config change and never a code change.
#
# The `sources[].url` fields are the ONLY thing you must fill in yourself.
# For each site: open it in your browser, set your filters (make / model /
# year / trim / max price), run the search, then COPY THE URL FROM THE
# ADDRESS BAR and paste it below, replacing the PASTE_URL_HERE placeholder.
# That pasted URL already encodes your filters — the tool just paginates it.

settings:
  db_path: "./carwatch.db"
  request_delay_seconds: [1.5, 4.0]   # random pause between page requests (politeness)
  delist_after_missed_runs: 1         # bump to 2 if you see listings flicker in/out
  user_agent: "CarWatch/1.0 (personal use)"

  # If a site blocks us, leave it alone for this many hours instead of asking
  # again on the next run. Backing off is politer, and avoids turning a
  # temporary block into a hardened one. 0 disables it.
  blocked_cooldown_hours: 12

  # Per-site pacing. mobile.de is by far the heaviest source here (173 listings
  # over ~9 pages, versus 1-2 pages for the others) and is the one site we
  # collect against robots.txt, so it gets a noticeably gentler cadence: ~9
  # pages at 5-12s is roughly a minute and a half of very light traffic, once a
  # day. Nothing about the tool depends on it finishing quickly.
  per_site:
    mobilede:
      request_delay_seconds: [5.0, 12.0]

searches:
  - name: "Skoda Octavia 2023 Combi RS"
    # --- metadata below is for display/grouping only; real filtering lives in the URLs ---
    make: "Skoda"
    model: "Octavia"
    trim: "RS"
    body: "Combi"            # the estate — the rarer config, expect few hits
    year_min: 2023
    year_max: 2023           # tip: widen to 2022 to catch more listings
    price_max: 28000
    currency: "EUR"          # standard for RO car listings; change to RON if you meant lei
    enabled: true

    sources:
      # AUTOVIT — build/test this adapter first (best-structured site).
      # How to get the URL: autovit.ro → Skoda → Octavia → set An (year) 2023,
      # Cutie automată if you want, Caroserie Combi, Versiune/RS, Preț până la 28000,
      # then copy the address-bar URL here.
      - site: "autovit"
        url: "https://www.autovit.ro/autoturisme/skoda/octavia/de-la-2023/q-rs?search%5Bfilter_enum_fuel_type%5D=petrol&search%5Bfilter_enum_gearbox%5D=automatic&search%5Bfilter_enum_body_type%5D=combi&search%5Badvanced_search_expanded%5D=true"

      # OLX — same idea on olx.ro under Autoturisme → Skoda Octavia, apply filters,
      # copy the resulting URL.
      - site: "olx"
        url: "https://www.olx.ro/auto-masini-moto-ambarcatiuni/autoturisme/skoda/?currency=EUR&search%5Bfilter_float_price:to%5D=28000&search%5Bfilter_enum_model%5D%5B0%5D=octavia&search%5Bfilter_float_year:from%5D=2023"

      # MOBILE.DE/RO — hardest to scrape (build last, treat as best-effort).
      # Set filters on mobile.de/ro and paste the search URL. If it gets blocked,
      # the dashboard will just show this source as "blocked" and the other two
      # keep working.
      # MOBILE.DE - the Romanian search app on www.mobile.de.
      #
      # Get this URL the same way as the others: search on mobile.de/ro, then
      # copy the address bar. It must be a /ro/vehicule/cautare.html URL - the
      # /ro/automobil/... SEO pages look similar but carry no ad ids, and the
      # German suchen.mobile.de host is behind Akamai and returns 403.
      #
      # Note: mobile.de's robots.txt disallows this path. You accepted that risk
      # for personal, low-volume use. CarWatch stays polite regardless - one run
      # a day, randomized delays, honest User-Agent, no anti-bot circumvention.
      - site: "mobilede"
        url: "https://www.mobile.de/ro/vehicule/c%C4%83utare.html?isSearchRequest=true&s=Car&vc=Car&fr=2023&ms=22900%3B12&pw=180%3A195&tr=AUTOMATIC_GEAR&c=EstateCar&ref=dsp"

  # ---------------------------------------------------------------------------
  # Wider comparison search. The strict 2023/Combi/RS search above is currently
  # empty on autovit (the site relaxes it rather than admitting zero results),
  # so this one is what actually carries data: Octavia, 2021 or newer, any trim
  # and body. ~40 active listings, which is also the price-history and
  # delisting signal the strict search can't give you yet.
  # ---------------------------------------------------------------------------
  - name: "Skoda Octavia 2021+ (any trim)"
    make: "Skoda"
    model: "Octavia"
    year_min: 2021
    currency: "EUR"
    enabled: true

    sources:
      # No price filter in this URL on purpose: autovit's robots.txt disallows
      # URLs matching *_price*, so a price-capped autovit search URL would be
      # off-limits to fetch. Filter by price in the dashboard instead.
      - site: "autovit"
        url: "https://www.autovit.ro/autoturisme/skoda/octavia/de-la-2021"

      - site: "olx"
        url: "https://www.olx.ro/auto-masini-moto-ambarcatiuni/autoturisme/skoda/?currency=EUR&search%5Bfilter_enum_model%5D%5B0%5D=octavia&search%5Bfilter_float_year:from%5D=2021"

# ------------------------------------------------------------------------------
# Want to also track the hatchback RS (far more listings, often cheaper), or a
# wider year range as a comparison? Add a second search block:
#
#   - name: "Skoda Octavia 2022-2023 RS (any body)"
